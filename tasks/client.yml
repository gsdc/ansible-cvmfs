---
- name: 키 디렉토리
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ cvmfs_keys | map(attribute='path') | map('dirname') | unique }}"

- name: 키
  ansible.builtin.copy:
    content: "{{ item.key }}"
    dest: "{{ item.path }}"
    owner: "{{ item.owner | default('root') }}"
    group: root
    mode: "0444"
  loop: "{{ cvmfs_keys }}"
  loop_control:
    label: "{{ item.path }}"

- name: cvmfs_config chksetup
  ansible.builtin.command: cvmfs_config chksetup
  register: _cvmfs_chksetup
  changed_when: false
  failed_when: false
  check_mode: false

- name: autofs 활성화
  ansible.builtin.service:
    name: autofs
    enabled: true
    state: started

- name: cvmfs_config setup (autofs 맵이 없을 때)
  ansible.builtin.command: cvmfs_config setup
  notify: Reload autofs
  when:
    - not ansible_check_mode
    - "'CernVM-FS map is not referenced' in _cvmfs_chksetup.stdout"

- name: config 저장소
  when: cvmfs_config_repo | length > 0
  block:
    - name: config 저장소 설정
      ansible.builtin.copy:
        content: |
          ## This file is maintained by Ansible - CHANGES WILL BE OVERWRITTEN
          CVMFS_SERVER_URL="{{ cvmfs_config_repo.urls | join(';') }}"
          CVMFS_PUBLIC_KEY="{{ cvmfs_config_repo.key.path }}"
        dest: /etc/cvmfs/config.d/{{ cvmfs_config_repo.repository.repository }}.conf
        owner: root
        group: root
        mode: "0444"
      notify: Reload cvmfs

    - name: config 저장소 기본값
      ansible.builtin.copy:
        content: |
          ## This file is maintained by Ansible - CHANGES WILL BE OVERWRITTEN
          CVMFS_CONFIG_REPOSITORY="{{ cvmfs_config_repo.repository.repository }}"
          CVMFS_DEFAULT_DOMAIN="{{ cvmfs_config_repo.domain }}"
          CVMFS_USE_GEOAPI="{{ cvmfs_config_repo.use_geoapi | default(false) | ternary('yes', 'no') }}"
        dest: /etc/cvmfs/default.d/80-ansible-galaxyproject-cvmfs.conf
        owner: root
        group: root
        mode: "0444"
      notify: Reload cvmfs

- name: domain.d 디렉토리
  ansible.builtin.file:
    path: /etc/cvmfs/domain.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: 도메인 설정
  ansible.builtin.copy:
    content: |
      ## This file is maintained by Ansible - CHANGES WILL BE OVERWRITTEN
      CVMFS_SERVER_URL="{{ item.urls | join(';') }}"
      CVMFS_KEYS_DIR=/etc/cvmfs/keys/{{ item.domain }}
      CVMFS_USE_GEOAPI="{{ item.use_geoapi | default(false) | ternary('yes', 'no') }}"
    dest: /etc/cvmfs/domain.d/{{ item.domain }}.conf
    owner: root
    group: root
    mode: "0644"
  loop: "{{ cvmfs_server_urls }}"
  loop_control:
    label: "{{ item.domain }}"
  notify: Reload cvmfs

- name: default.local
  ansible.builtin.template:
    src: default.local.j2
    dest: /etc/cvmfs/default.local
    owner: root
    group: root
    mode: "0644"
  notify: Reload cvmfs

- name: 저장소별 클라이언트 옵션 디렉토리
  ansible.builtin.file:
    path: /etc/cvmfs/repositories.d/{{ item.repository }}
    state: directory
    mode: "0755"
  loop: "{{ cvmfs_repositories | selectattr('client_options', 'defined') | list }}"
  loop_control:
    label: "{{ item.repository }}"

- name: 저장소별 클라이언트 옵션
  ansible.builtin.lineinfile:
    path: /etc/cvmfs/repositories.d/{{ item.0.repository }}/client.conf
    regexp: "^{{ item.1.split('=')[0] }}=.*"
    line: "{{ item.1 }}"
    create: true
    mode: "0644"
  loop: "{{ cvmfs_repositories | subelements('client_options', skip_missing=true) }}"
  loop_control:
    label: "{{ item.0.repository }}: {{ item.1 }}"
  notify: Reload cvmfs

- name: 추가 설정 파일
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ item.key }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ cvmfs_local_configs | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  notify: Reload cvmfs

- name: 지울 설정 파일
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ cvmfs_absent_configs }}"
  notify: Reload cvmfs
