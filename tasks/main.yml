---
- name: 캐시 전용 LV
  ansible.builtin.include_tasks: cache_lv.yml
  when: cvmfs_cache_lv | bool

- name: 패키지·저장소
  ansible.builtin.include_tasks: install.yml

- name: 클라이언트 설정
  ansible.builtin.include_tasks: client.yml

- name: autofs 설정
  ansible.builtin.include_tasks: autofs.yml

# 반드시 패키지 설치(/etc/auto.cvmfs 생성) 뒤
- name: IPA automount location 전환
  ansible.builtin.include_tasks: ipa_automount.yml
  when: cvmfs_ipa_automount_location | length > 0

- name: 설정 변경 반영 (handler 를 여기서 실행)
  ansible.builtin.meta: flush_handlers

- name: autofs 재시작
  ansible.builtin.service:
    name: autofs
    state: restarted
  when: cvmfs_restart_autofs | bool

- name: cvmfs_config probe
  ansible.builtin.command: cvmfs_config probe
  changed_when: false
  when:
    - cvmfs_probe | bool
    - not ansible_check_mode
