---
# gsdc.cvmfs -- CernVM-FS 클라이언트 role
#
# galaxyproject.cvmfs(0.5.x) 의 클라이언트 동작을 옮기고 변수 이름을 그대로 유지한다
# (기존 group_vars 를 고치지 않고 같은 결과 파일이 나오도록). 사이트 playbook 마다 복사돼 있던
# 기능(캐시 LV, 추가 설정 파일, autofs 재시작 drop-in, IPA automount 전환)은 변수로 켜고 끈다.
# 기본값은 IPA·LVM 이 없는 일반 환경에서도 동작하도록 모두 꺼져 있다.

# ---------------------------------------------------------------- 패키지·저장소
cvmfs_install_repo: true            # cernvm yum 저장소와 GPG 키를 관리 (OSG 등 다른 저장소를 쓰면 false)
cvmfs_packages: [cvmfs]
cvmfs_config_package: null          # 예: cvmfs-config-default, cvmfs-config-osg
cvmfs_upgrade_client: false         # true 면 state=latest

# ---------------------------------------------------------------- galaxyproject.cvmfs 호환 변수
cvmfs_keys: []                      # [{path, key, owner?}]
cvmfs_server_urls: []               # [{domain, urls: [], use_geoapi?}] -> /etc/cvmfs/domain.d/<domain>.conf
cvmfs_repositories: []              # [{repository, client_options?: ["KEY=VAL"]}]
cvmfs_http_proxies: [DIRECT]
cvmfs_quota_limit: 4000             # MB
cvmfs_cache_base: /var/lib/cvmfs
cvmfs_params: {}                    # default.local 끝에 KEY="VALUE" 로 추가 (예: CVMFS_TIMEOUT: 10)
cvmfs_config_repo: {}               # {repository: {repository}, urls: [], key: {path}, domain, use_geoapi?}
cvmfs_telemetry: false
cvmfs_telemetry_rate: 300
cvmfs_influx_host: ""
cvmfs_influx_port: 8092
cvmfs_influx_metric_name: cvmfs
cvmfs_influx_extra_tags: ""
cvmfs_influx_extra_fields: ""

# ---------------------------------------------------------------- 추가 설정 파일
# 경로 -> 내용. config.d/domain.d 의 .local 파일 등 role 이 따로 다루지 않는 설정.
#   cvmfs_local_configs:
#     /etc/cvmfs/config.d/cms.cern.ch.local: |
#       export CMS_LOCAL_SITE=/cvmfs/cms.cern.ch/SITECONF/T3_KR_KISTI
cvmfs_local_configs: {}
cvmfs_absent_configs: []            # 지울 경로 목록
cvmfs_reload_on_change: false       # 설정이 바뀌면 cvmfs_config reload. 작업이 몰린 노드에서 reload 가 crash 한 사례가 있어(2026-09-28) 기본은 끔 -- 새 값은 저장소가 다시 마운트될 때 반영
cvmfs_probe: false                  # 마지막에 cvmfs_config probe 로 확인

# ---------------------------------------------------------------- 캐시 전용 LV (LVM 호스트)
cvmfs_cache_lv: false
cvmfs_cache_lv_vg: ""               # 비우면 자동: VG "cache" -> LV "var" 가 있는 VG 순
cvmfs_cache_lv_name: cvmfs_cache
cvmfs_cache_lv_mb: "{{ ((cvmfs_quota_limit | int) * 1.2 + 1024) | int }}"
cvmfs_cache_lv_fstype: xfs

# ---------------------------------------------------------------- autofs
cvmfs_autofs_restart_dropin: false  # Restart=on-failure + 죽은 /cvmfs(fd=-1) lazy umount drop-in
cvmfs_nsswitch_automount: ""        # 예: "sss files". 비우면 nsswitch.conf 를 건드리지 않음
cvmfs_restart_autofs: false         # 마지막에 autofs 재시작 (작업 도는 호스트에서는 끄는 것을 권장)

# ---------------------------------------------------------------- IPA automount
# 설정하면 /etc/auto.cvmfs 가 생긴 뒤(패키지 설치 뒤)에만 IPA automount location 을 전환한다.
# 조건: IPA 클라이언트 + ipa-client-automount 존재 + 해당 location 의 auto.master 에
#       <cvmfs_mount_point> -> program:/etc/auto.cvmfs 키 존재 + /etc/auto.cvmfs 실행 파일 존재
#       + 현재 location 이 미설정이거나 cvmfs_ipa_automount_replace 에 있음
cvmfs_ipa_automount_location: ""    # 예: cvmfs
cvmfs_ipa_automount_replace: [gsdc]
cvmfs_mount_point: /cvmfs
# Foreman kickstart 의 autofs start-override.conf(sss 인스턴스 강제 검사)는 program 맵만 주는
# location 과 양립하지 않아 autofs 재시작 루프를 만든다 -- 전환 전에 /root 로 옮긴다.
cvmfs_ipa_automount_remove_start_override: true
